; Ajustes de PHP para S.I.G.S.M.
date.timezone = America/Montevideo

; El sistema acepta PDF de hasta 10 MB; se deja un margen
upload_max_filesize = 12M
post_max_size = 14M

; No mostrar errores al público: se registran en el log del contenedor
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Sesiones más seguras
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
