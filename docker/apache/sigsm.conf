# Ajustes de Apache para S.I.G.S.M. (contenedor app)
ServerTokens Prod
ServerSignature Off

# Sin listado de directorios
<Directory /var/www/html>
    Options -Indexes
</Directory>

# Los PDF solo se entregan a traves de servir-documento.php
<Directory "/var/www/html/Modulo Documentacion/uploads">
    Require all denied
</Directory>
